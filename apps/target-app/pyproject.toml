[project]
name = "checkout-service"
version = "0.1.0"
description = "The target ('victim') checkout service with injectable faults"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "gitpython>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
inject-fault = "faults.inject:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "faults"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
