[project]
name = "investigator-mcp-server"
version = "0.1.0"
description = "Read-only investigation tools exposed over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "gitpython>=3.1",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
