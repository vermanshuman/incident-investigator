[project]
name = "investigator-agent"
version = "0.1.0"
description = "LangGraph hypothesis-driven investigation loop"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "investigator-mcp-server",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "opentelemetry-api>=1.26",
    "typer>=0.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
investigate = "agent.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv.sources]
investigator-mcp-server = { path = "../mcp-server", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
