[project]
name = "investigator-evals"
version = "0.1.0"
description = "Scripted incidents, headless runner, scoring"
requires-python = ">=3.11"
dependencies = [
    "investigator-agent",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
run-evals = "evals.runner:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.uv.sources]
investigator-agent = { path = "../agent", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
